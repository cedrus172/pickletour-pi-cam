name: Build Windows .exe

on:
  push:
    branches: [main]
    paths:
      - 'win/**'
      - '.github/workflows/build-win.yml'
  workflow_dispatch: {}   # Chạy tay từ tab Actions trên GitHub

permissions:
  contents: write   # cần để tạo release + upload asset

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: win/requirements.txt

      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.0
          pip list

      - name: Build onefile .exe (verbose)
        run: pyinstaller --clean --noconfirm --log-level=INFO pitailscale.spec

      - name: Sanity check binary (non-blocking)
        continue-on-error: true
        run: |
          dir dist
          if (Test-Path dist\pitailscale.exe) { Write-Host "✓ pitailscale.exe exists" } else { Write-Host "✗ missing"; exit 1 }
        shell: pwsh

      - name: Upload artifact (per-commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitailscale-exe
          path: win/dist/pitailscale.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release (tag build-<n>)
        if: always() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Auto-build từ commit ${{ github.sha }}.
            Chạy `pitailscale.exe --install` (as Administrator) để đăng ký
            Task Scheduler + mở firewall + start server.
          files: win/dist/pitailscale.exe
          fail_on_unmatched_files: true
