name: Build Windows .exe

on:
  push:
    branches: [main]
    paths:
      - 'win/**'
      - 'rec_shared.py'
      - 'vendors.py'
      - 'recorder.py'
      - 'clipapp.py'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/build-win.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: win/requirements.txt

      # ---------------------------------------------------------------
      # Copy shared source từ root → win/ (một source of truth)
      # ---------------------------------------------------------------
      - name: Copy shared Python modules
        run: |
          Copy-Item ..\rec_shared.py .
          Copy-Item ..\vendors.py .
          Copy-Item ..\recorder.py .
          Copy-Item ..\clipapp.py .
          dir *.py
        shell: pwsh

      - name: Copy recorder + clip templates & static
        run: |
          # Merge các template của recorder.html / clip.html vào win/templates
          # (gateway's index.html đã có sẵn trong win/templates)
          Copy-Item ..\templates\recorder.html .\templates\ -Force
          Copy-Item ..\templates\clip.html .\templates\ -Force
          Copy-Item ..\templates\monitor.html .\templates\ -ErrorAction SilentlyContinue
          # Static files (recorder.js/css, clip.js/css)
          Copy-Item ..\static\recorder.js .\static\ -Force
          Copy-Item ..\static\recorder.css .\static\ -Force
          Copy-Item ..\static\clip.js .\static\ -Force
          Copy-Item ..\static\clip.css .\static\ -Force
          Copy-Item ..\static\style.css .\static\ -Force -ErrorAction SilentlyContinue
          Copy-Item ..\static\monitor.js .\static\ -ErrorAction SilentlyContinue
          Copy-Item ..\static\monitor.css .\static\ -ErrorAction SilentlyContinue
          dir templates
          dir static
        shell: pwsh

      # ---------------------------------------------------------------
      # Download ffmpeg + ffprobe static build (recorder/clip cần)
      # ---------------------------------------------------------------
      - name: Download ffmpeg static build
        run: |
          mkdir -Force bin | Out-Null
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $zip = "$env:TEMP\ffmpeg.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ffmpeg-extract" -Force
          $exes = Get-ChildItem "$env:TEMP\ffmpeg-extract" -Recurse -Include ffmpeg.exe,ffprobe.exe
          foreach ($e in $exes) {
            Copy-Item $e.FullName .\bin\ -Force
            Write-Host "Copied $($e.Name) ($([math]::Round($e.Length / 1MB, 1)) MB)"
          }
          dir bin
        shell: pwsh

      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.0
          pip list

      - name: Build onefile .exe (verbose)
        run: pyinstaller --clean --noconfirm --log-level=INFO pitailscale.spec

      - name: Sanity check binary (non-blocking)
        continue-on-error: true
        run: |
          dir dist
          if (Test-Path dist\pitailscale.exe) {
            $size = (Get-Item dist\pitailscale.exe).Length
            Write-Host "✓ pitailscale.exe exists ($([math]::Round($size / 1MB, 1)) MB)"
          } else {
            Write-Host "✗ missing"; exit 1
          }
        shell: pwsh

      - name: Upload artifact (per-commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitailscale-exe
          path: win/dist/pitailscale.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release (tag build-<n>)
        if: always() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Auto-build từ commit ${{ github.sha }}.

            **Multi-mode .exe**: gateway + recorder + clip trong 1 file.

            Cài (mở Administrator CMD/PowerShell):
            ```
            pitailscale.exe --install
            ```
            Sẽ đăng ký 3 Task Scheduler + 3 firewall rule:
            - Gateway  (9999): scan LAN + forward TCP/UDP qua Tailscale
            - Recorder (9997): admin NVR (Dahua + Hikvision)
            - Clip     (9996): public SPA cho khách tải clip

            ffmpeg.exe đã bundled sẵn. Nmap auto-cài qua winget nếu chưa có.
          files: win/dist/pitailscale.exe
          fail_on_unmatched_files: true
